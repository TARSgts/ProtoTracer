    -D PROJECT_PROTOGEN_WS35
    -D TEENSY_OPT_FASTEST_LTO

[env:teensy41beta]
extends = common
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags =
    -D PROJECT_PROTOGEN_BETA
    -D TEENSY_OPT_FASTEST_LTO

[env:teensy41verifyrender]
extends = common
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags =
    -D PROJECT_VERIFY_ENGINE
    -D TEENSY_OPT_FASTEST_LTO


[env:teensy41verifyhardware]
